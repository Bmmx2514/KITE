<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KITE 企业知识问答评测</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="主导航">
      <div class="brand">KITE</div>
      <nav id="nav" class="nav" hidden>
        <button class="nav-item active" data-view="overview">总览与运行</button>
        <button class="nav-item" data-view="runs">运行与对比</button>
        <button class="nav-item" data-view="reviews">人工复核</button>
      </nav>
    </aside>

    <div class="stage">
      <header class="topbar"><div>企业知识问答评测工作台</div><div id="operator">本地工作台</div></header>

      <section id="login" class="login-panel" aria-labelledby="login-title">
        <h1 id="login-title">检验每一个<br><em>知识边界。</em></h1>
        <p>输入本地工作台令牌，查看评测轨迹、启动重复运行并记录复核结论。</p>
        <form id="login-form"><label for="token">工作台令牌</label><div class="login-row"><input id="token" type="password" autocomplete="off" required minlength="24" placeholder="输入 .env 中的 KITE_WORKBENCH_TOKEN"><button type="submit" class="primary">进入工作台</button></div></form>
        <div id="login-error" class="error" role="alert"></div>
      </section>

      <main id="main" hidden>
        <section id="overview" class="view">
          <div class="page-heading"><h1>评测总览</h1><p>查看场景并启动评测，结果会保存到本地。</p></div>
          <div id="metrics" class="metrics" aria-live="polite"></div>
          <div class="two-column">
            <section class="panel run-panel"><div class="panel-heading"><h2>启动新评测</h2><p>每轮都会保存回答轨迹、质量评分和安全评分。</p></div>
              <form id="run-form" class="form-grid">
                <label>测试 Agent<select id="agent-select" required></select></label>
                <label>场景范围<select id="split-select"><option value="">全部场景</option><option value="dev">开发集</option><option value="holdout">保留集</option></select></label>
                <label>重复次数<select id="times-select"><option value="3">3 次</option><option value="2">2 次</option></select></label>
                <label>指定场景 ID（可选，逗号分隔）<input id="scenario-input" placeholder="例如 travel-employee, directory-injection"></label>
                <button class="primary run-button" type="submit">启动评测</button>
              </form>
              <div id="job-status" class="job-status" aria-live="polite">尚未启动评测</div>
            </section>
            <section class="panel scenario-panel"><div class="panel-heading"><h2>场景目录</h2><p>先查看问题、提问角色和预期行为，再决定运行范围。</p></div><label class="search-label">搜索场景<input id="scenario-search" placeholder="搜索 ID、问题或类别"></label><div id="scenario-list" class="scenario-list"></div></section>
          </div>
        </section>

        <section id="runs" class="view" hidden>
          <div class="page-heading"><h1>运行与对比</h1><p>查看每轮结果与轨迹，并比较改动前后的表现。</p></div>
          <div class="two-column runs-grid"><section class="panel"><div class="panel-heading"><h2>运行记录</h2></div><div id="bundle-list" class="bundle-list"></div></section><section class="panel"><div class="panel-heading"><h2>版本对比</h2></div><div class="compare-controls"><label>对比前<select id="compare-old"></select></label><label>对比后<select id="compare-new"></select></label><button id="compare-button" class="secondary" type="button">生成对比报告</button></div><pre id="comparison" class="report">选择两个运行后生成报告。</pre></section></div>
          <section class="panel case-panel"><div class="panel-heading"><h2 id="case-title">选择一个运行查看场景</h2></div><div id="case-list" class="case-list"></div></section>
        </section>

        <section id="reviews" class="view" hidden>
          <div class="page-heading"><h1>人工复核</h1><p>检查异常场景，记录你的判断和依据。</p></div>
          <div class="review-toolbar"><label>选择运行<select id="review-bundle"></select></label><span id="review-count"></span></div><div id="review-list" class="review-list"></div>
        </section>
      </main>
    </div>
  </div>
  <dialog id="trace-dialog"><div class="dialog-heading"><h2 id="trace-title">评测轨迹</h2><button id="close-trace" class="close-button" aria-label="关闭">×</button></div><div id="trace-tabs" class="trace-tabs"></div><pre id="trace-content"></pre></dialog>
</body>
</html>
